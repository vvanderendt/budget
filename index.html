<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#16302A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Maandbudget</title>
<style>
  html { background: #F1F8F4; }
  body { margin: 0; padding: 0; background: #F1F8F4; min-height: 100vh; min-height: 100dvh; }
</style>
</head>
<body>
<div id="app-root">
  <style>
    #app-root {
      --paper: #F1F8F4;
      --card: #FFFFFF;
      --ink: #12211A;
      --muted: #66756C;
      --line: #E0EAE4;
      --pine: #16302A;
      --pine-soft: #2C4C42;
      --pale: #E4F3EA;
      --clay: #E4795E;
      --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;

      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      max-width: 480px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
      min-height: 100dvh;
      -webkit-text-size-adjust: 100%;
      box-sizing: border-box;
    }
    #app-root *, #app-root *::before, #app-root *::after { box-sizing: border-box; }

    #app-root :focus-visible {
      outline: 2px solid var(--pine);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---------- kopvlak ---------- */
    .hero {
      background: var(--pine);
      color: #EAF1EA;
      border-radius: 16px;
      padding: 22px 20px 18px;
    }
    .hero-label {
      font-size: 13px;
      letter-spacing: .01em;
      color: #A9C0B4;
      margin: 0 0 6px;
    }
    .hero-amount {
      font-family: var(--serif);
      font-size: 52px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: -.015em;
      margin: 0;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .hero-amount.negative { color: var(--clay); }
    .hero-sub {
      font-size: 13.5px;
      color: #A9C0B4;
      margin: 10px 0 0;
    }
    .hero-sub b { color: #EAF1EA; font-weight: 600; }

    .strip { margin-top: 18px; }
    .strip-track {
      position: relative;
      height: 3px;
      background: #2C4C42;
      border-radius: 2px;
    }
    .strip-fill {
      position: absolute; inset: 0 auto 0 0;
      background: #7FA894;
      border-radius: 2px;
    }
    .strip-dot {
      position: absolute;
      top: 50%;
      width: 11px; height: 11px;
      margin-left: -5.5px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #EAF1EA;
      border: 2px solid var(--pine);
    }
    .strip-ends {
      display: flex; justify-content: space-between;
      font-size: 11.5px; color: #8CA79A;
      margin-top: 8px;
    }
    .hero-updated {
      margin: 17px 0 0;
      padding-top: 14px;
      border-top: 1px solid #2C4C42;
      font-size: 12.5px;
      line-height: 1.45;
      color: #A9C0B4;
    }
    .hero-updated b { color: #EAF1EA; font-weight: 600; }

    /* ---------- secties ---------- */
    .section { margin-top: 26px; }
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px;
    }
    .section-title {
      font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.005em;
    }
    .section-note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(18, 33, 26, .04);
    }

    /* ---------- rekeningen ---------- */
    .acc {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
    }
    .acc:last-child { border-bottom: 0; }
    .acc input {
      font: inherit; font-size: 16px; color: var(--ink);
      border: 0; background: transparent; padding: 4px 2px;
      min-width: 0;
    }
    .acc .acc-name { flex: 1 1 auto; }
    .acc .acc-amt {
      flex: 0 0 108px; text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .acc input::placeholder { color: #A8B7AD; font-weight: 400; }
    .acc-total {
      display: flex; justify-content: space-between;
      padding: 10px 12px;
      background: var(--pale);
      font-size: 14px; font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- lastenregels ---------- */
    .bill {
      display: flex; align-items: center; gap: 11px;
      width: 100%;
      padding: 11px 12px;
      border: 0; border-bottom: 1px solid var(--line);
      background: transparent;
      font: inherit; text-align: left;
      color: var(--ink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .bill:last-child { border-bottom: 0; }
    .bill:active { background: var(--pale); }
    .mark {
      flex: 0 0 20px; height: 20px;
      border: 1.5px solid #C4D6CB;
      border-radius: 6px;
      display: grid; place-items: center;
      font-size: 12px; line-height: 1;
      color: transparent;
    }
    .bill.done .mark {
      background: var(--pine); border-color: var(--pine); color: #EAF1EA;
    }
    .bill-name {
      flex: 1 1 auto; font-size: 15.5px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bill-amt {
      flex: 0 0 auto; font-size: 15.5px; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .bill.done .bill-name, .bill.done .bill-amt {
      color: #9DB0A4; text-decoration: line-through;
    }
    .bill.parked { background: #F6F9F7; }
    .bill.parked .mark {
      border-style: dashed; border-color: #C4D6CB;
      color: #9DB0A4; background: transparent;
    }
    .bill.parked .bill-name, .bill.parked .bill-amt { color: #9DB0A4; }
    .bill-tag {
      flex: 0 0 auto;
      font-size: 11px; font-weight: 600;
      color: #66756C; background: var(--pale);
      border-radius: 999px;
      padding: 3px 8px;
      white-space: nowrap;
    }

    .empty {
      padding: 18px 14px; font-size: 14px; color: var(--muted);
      line-height: 1.5; margin: 0;
    }

    /* ---------- bewerkstand ---------- */
    .edit-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 6px;
      border-bottom: 1px solid var(--line);
    }
    .edit-row:last-child { border-bottom: 0; }
    .edit-num {
      flex: 0 0 26px; text-align: right;
      font-size: 11px; color: #AEBDB3;
      font-variant-numeric: tabular-nums;
    }
    .edit-row input {
      font: inherit; font-size: 16px; color: var(--ink);
      border: 0; border-bottom: 1px solid transparent;
      background: transparent; padding: 5px 2px; min-width: 0;
    }
    .edit-row input:focus { border-bottom-color: var(--pine); outline: none; }
    .edit-row .e-desc { flex: 1 1 auto; }
    .edit-row .e-amt {
      flex: 0 0 96px; text-align: right;
      font-variant-numeric: tabular-nums; font-weight: 600;
    }
    .edit-row input::placeholder { color: #B5C4BA; font-weight: 400; }

    /* ---------- knoppen ---------- */
    .btn {
      font: inherit; font-size: 13.5px; font-weight: 600;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--pine);
      background: transparent; color: var(--pine);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .btn.solid { background: var(--pine); color: #EAF1EA; }
    .btn.ghost { border-color: var(--line); color: var(--muted); }
    .btn:active { transform: translateY(1px); }

    .totals {
      display: flex; justify-content: space-between;
      padding: 11px 12px;
      background: var(--pale);
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }
    .totals span:last-child { font-weight: 650; }

    .footer { margin-top: 30px; }
    .reset-confirm {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .reset-confirm p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
    .reset-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .saved {
      font-size: 12px; color: var(--muted);
      text-align: center; margin-top: 16px; min-height: 16px;
    }

    .bk-text {
      width: 100%;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.45;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #FAFDFB;
      resize: vertical;
      margin-bottom: 10px;
    }
    .bk-hint { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
    .bk-hint.warn { color: #A23E2C; }

    .credit {
      margin: 32px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 11.5px;
      color: #93A399;
      letter-spacing: .02em;
    }
  </style>

  <div class="hero">
    <p class="hero-label" id="heroLabel">nog te besteden</p>
    <p class="hero-amount" id="heroAmount">&euro; 0,00</p>
    <p class="hero-sub" id="heroSub"></p>
    <div class="strip">
      <div class="strip-track">
        <div class="strip-fill" id="stripFill"></div>
        <div class="strip-dot" id="stripDot"></div>
      </div>
      <div class="strip-ends">
        <span id="stripStart"></span>
        <span id="stripEnd"></span>
      </div>
    </div>
    <p class="hero-updated" id="heroUpdated"></p>
  </div>

  <div class="section">
    <div class="section-head">
      <h2 class="section-title">Saldo + inkomsten</h2>
    </div>
    <div class="panel">
      <div id="accounts"></div>
      <div class="acc-total">
        <span>Totaal</span>
        <span id="accTotal">&euro; 0,00</span>
      </div>
    </div>
  </div>

  <div id="lists"></div>

  <div class="section">
    <div class="panel">
      <div class="totals"><span>Al afgeschreven</span><span id="paidTotal">&euro; 0,00</span></div>
      <div class="totals" style="background:transparent;border-top:1px solid var(--line)">
        <span>Nog af te schrijven</span><span id="openTotal">&euro; 0,00</span>
      </div>
    </div>
  </div>

  <div class="footer" id="footer"></div>
  <div class="section" id="backup"></div>
  <p class="saved" id="saved"></p>
  <p class="credit">Created by V. van der Endt &mdash; Sept 2026</p>
</div>

<script>
(function () {
  var KEY = 'maandbudget-v1';
  var SALARY_DAY = 23;
  var ACC_COUNT = 4;

  var LISTS = [
    {
      key: 'bills',
      count: 75,
      title: 'Maandelijkse vaste lasten',
      empty: 'Nog geen maandelijkse lasten. Tik op Bewerken en vul je huur, verzekeringen en abonnementen in — daarna tik je hier elke maand aan wat al is afgeschreven.'
    },
    {
      key: 'periodic',
      count: 25,
      tri: true,
      title: 'Periodieke vaste lasten',
      empty: 'Nog geen periodieke lasten. Denk aan nota’s per kwartaal of per jaar. Tik een regel aan om te wisselen tussen aan de beurt, afgeschreven en niet aan de beurt.'
    }
  ];

  function blankBill() { return { desc: '', amount: '', paid: false, skip: false }; }
  function blankList(n) { return Array.from({ length: n }, blankBill); }
  function blankAccounts() {
    return Array.from({ length: ACC_COUNT }, function () { return { name: '', amount: '' }; });
  }

  var state = {
    accounts: blankAccounts(),
    bills: blankList(75),
    periodic: blankList(25),
    lastReset: null,
    lastChange: null
  };

  var editing = { bills: false, periodic: false };
  var confirming = false;
  var backupMode = null;
  var saveTimer = null;

  var eur = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' });
  var eur0 = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  var dayMonth = new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'long' });
  var dayMonthShort = new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'short' });
  var stampDate = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
  var stampTime = new Intl.DateTimeFormat('nl-NL', { hour: '2-digit', minute: '2-digit' });

  var $ = function (id) { return document.getElementById(id); };

  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (!v) return 0;
    var s = String(v).replace(/[^0-9,.\-]/g, '');
    if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  /* ---------- salarisdata ---------- */
  function periodDates() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var next, prev;
    if (today.getDate() < SALARY_DAY) {
      next = new Date(today.getFullYear(), today.getMonth(), SALARY_DAY);
      prev = new Date(today.getFullYear(), today.getMonth() - 1, SALARY_DAY);
    } else {
      next = new Date(today.getFullYear(), today.getMonth() + 1, SALARY_DAY);
      prev = new Date(today.getFullYear(), today.getMonth(), SALARY_DAY);
    }
    var day = 86400000;
    return {
      today: today, next: next, prev: prev,
      daysLeft: Math.round((next - today) / day),
      progress: Math.min(1, Math.max(0, (today - prev) / (next - prev)))
    };
  }

  /* ---------- opslag ---------- */
  function flash(msg) {
    $('saved').textContent = msg;
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { $('saved').textContent = ''; }, 1600);
  }

  function localSet(json) {
    try { window.localStorage.setItem(KEY, json); return true; } catch (e) { return false; }
  }
  function localGet() {
    try { return window.localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function touch() { state.lastChange = new Date().toISOString(); }

  function save(quiet) {
    /* Meteen wegschrijven: wie de app vlak na een tik sluit, raakt niets kwijt. */
    var json = JSON.stringify(state);
    var ok = localSet(json);
    if (!quiet) flash(ok ? 'Opgeslagen' : 'Opslaan lukte niet');

    if (!window.storage) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        window.storage.set(KEY, JSON.stringify(state))['catch'](function () {});
      } catch (e) { /* de browser heeft het al */ }
    }, 350);
  }

  function apply(json) {
    if (!json) return false;
    var d = JSON.parse(json);
    if (Array.isArray(d.accounts)) {
      for (var i = 0; i < ACC_COUNT; i++) if (d.accounts[i]) state.accounts[i] = d.accounts[i];
    }
    LISTS.forEach(function (L) {
      var src = d[L.key];
      if (!Array.isArray(src)) return;
      for (var j = 0; j < L.count; j++) {
        if (!src[j]) continue;
        var b = src[j];
        state[L.key][j] = {
          desc: typeof b.desc === 'string' ? b.desc : '',
          amount: b.amount == null ? '' : b.amount,
          paid: !!b.paid,
          skip: L.tri ? !!b.skip : false
        };
      }
    });
    state.lastReset = d.lastReset || null;
    state.lastChange = d.lastChange || null;
    return true;
  }

  function load() {
    if (window.storage) {
      return window.storage.get(KEY).then(function (r) {
        if (!(r && r.value && apply(r.value))) apply(localGet());
      })['catch'](function () { try { apply(localGet()); } catch (e) {} });
    }
    try { apply(localGet()); } catch (e) {}
    return Promise.resolve();
  }

  /* ---------- berekening ---------- */
  function listStats(key) {
    var open = 0, paid = 0, parked = 0, filled = 0, done = 0, active = 0, skipped = 0;
    state[key].forEach(function (b) {
      var amt = num(b.amount);
      if (b.desc.trim() === '' && amt === 0) return;
      filled++;
      if (b.skip) { parked += amt; skipped++; return; }
      active++;
      if (b.paid) { paid += amt; done++; } else { open += amt; }
    });
    return {
      open: open, paid: paid, parked: parked,
      filled: filled, done: done, active: active, skipped: skipped
    };
  }

  function sums() {
    var saldo = 0, open = 0, paid = 0;
    state.accounts.forEach(function (a) { saldo += num(a.amount); });
    LISTS.forEach(function (L) {
      var s = listStats(L.key);
      open += s.open; paid += s.paid;
    });
    return { saldo: saldo, open: open, paid: paid, rest: saldo - open };
  }

  /* ---------- weergave ---------- */
  function relativeDay(then, today) {
    var d0 = new Date(then.getFullYear(), then.getMonth(), then.getDate());
    var diff = Math.round((today - d0) / 86400000);
    if (diff === 0) return 'vandaag';
    if (diff === 1) return 'gisteren';
    if (diff < 7) return diff + ' dagen geleden';
    return null;
  }

  function renderHero() {
    var s = sums(), p = periodDates();
    $('heroLabel').textContent = 'nog te besteden tot ' + dayMonth.format(p.next);
    var el = $('heroAmount');
    el.textContent = eur.format(s.rest);
    el.classList.toggle('negative', s.rest < 0);

    var perDay = p.daysLeft > 0 ? s.rest / p.daysLeft : s.rest;
    var dagen = p.daysLeft === 1 ? '1 dag' : p.daysLeft + ' dagen';
    if (s.rest < 0) {
      $('heroSub').innerHTML = 'Je komt <b>' + eur.format(Math.abs(s.rest)) + '</b> tekort · nog ' + dagen;
    } else {
      $('heroSub').innerHTML = 'Nog <b>' + dagen + '</b> · dat is ' + eur0.format(perDay) + ' per dag';
    }

    $('stripFill').style.width = (p.progress * 100) + '%';
    $('stripDot').style.left = (p.progress * 100) + '%';
    $('stripStart').textContent = dayMonthShort.format(p.prev);
    $('stripEnd').textContent = dayMonthShort.format(p.next);

    var up = $('heroUpdated');
    if (state.lastChange) {
      var t = new Date(state.lastChange);
      var rel = relativeDay(t, p.today);
      var when = rel
        ? rel + ' om ' + stampTime.format(t)
        : stampDate.format(t) + ' om ' + stampTime.format(t);
      up.innerHTML = 'Laatst bijgewerkt: <b>' + when + '</b>';
    } else {
      up.textContent = 'Nog niets ingevuld';
    }

    $('accTotal').textContent = eur.format(s.saldo);
    $('paidTotal').textContent = eur.format(s.paid);
    $('openTotal').textContent = eur.format(s.open);
  }

  function renderAccounts() {
    var wrap = $('accounts');
    wrap.textContent = '';
    state.accounts.forEach(function (a, i) {
      var row = document.createElement('div');
      row.className = 'acc';

      var name = document.createElement('input');
      name.className = 'acc-name';
      name.type = 'text';
      name.value = a.name;
      name.placeholder = 'Rekening ' + (i + 1);
      name.setAttribute('aria-label', 'Naam rekening ' + (i + 1));
      name.addEventListener('input', function () {
        a.name = name.value; touch(); renderHero(); save(true);
      });

      var amt = document.createElement('input');
      amt.className = 'acc-amt';
      amt.type = 'text';
      amt.inputMode = 'decimal';
      amt.value = a.amount;
      amt.placeholder = '0,00';
      amt.setAttribute('aria-label', 'Saldo rekening ' + (i + 1));
      amt.addEventListener('input', function () {
        a.amount = amt.value; touch(); renderHero(); save(true);
      });
      amt.addEventListener('blur', function () {
        if (amt.value.trim() !== '') {
          a.amount = num(amt.value).toFixed(2).replace('.', ',');
          amt.value = a.amount;
          save(true);
        }
      });

      row.appendChild(name);
      row.appendChild(amt);
      wrap.appendChild(row);
    });
  }

  function renderList(L) {
    var sec = document.createElement('div');
    sec.className = 'section';

    var head = document.createElement('div');
    head.className = 'section-head';
    var h = document.createElement('h2');
    h.className = 'section-title';
    h.textContent = L.title;
    var btn = document.createElement('button');
    btn.className = editing[L.key] ? 'btn' : 'btn ghost';
    btn.textContent = editing[L.key] ? 'Klaar' : 'Bewerken';
    btn.addEventListener('click', function () {
      editing[L.key] = !editing[L.key];
      var wasEditing = !editing[L.key];
      renderLists();
      renderHero();
      if (wasEditing) save();
    });
    head.appendChild(h);
    head.appendChild(btn);
    sec.appendChild(head);

    var st = listStats(L.key);
    if (st.filled > 0 && !editing[L.key]) {
      var note = document.createElement('p');
      note.className = 'section-note';
      if (L.tri) {
        var parts = [];
        if (st.active > 0) parts.push(st.done + ' van ' + st.active + ' afgeschreven');
        else parts.push('niets aan de beurt deze maand');
        if (st.skipped > 0) {
          parts.push(st.skipped + ' geparkeerd (' + eur.format(st.parked) + ')');
        }
        note.textContent = parts.join(' · ');
      } else {
        note.textContent = st.done + ' van ' + st.filled + ' afgeschreven';
      }
      sec.appendChild(note);
    }

    var panel = document.createElement('div');
    panel.className = 'panel';

    if (editing[L.key]) {
      state[L.key].forEach(function (b, i) {
        var row = document.createElement('div');
        row.className = 'edit-row';

        var n = document.createElement('span');
        n.className = 'edit-num';
        n.textContent = i + 1;

        var desc = document.createElement('input');
        desc.className = 'e-desc';
        desc.type = 'text';
        desc.value = b.desc;
        desc.placeholder = 'Omschrijving';
        desc.setAttribute('aria-label', L.title + ', omschrijving regel ' + (i + 1));
        desc.addEventListener('input', function () { b.desc = desc.value; touch(); save(true); });

        var amt = document.createElement('input');
        amt.className = 'e-amt';
        amt.type = 'text';
        amt.inputMode = 'decimal';
        amt.value = b.amount;
        amt.placeholder = '0,00';
        amt.setAttribute('aria-label', L.title + ', bedrag regel ' + (i + 1));
        amt.addEventListener('input', function () { b.amount = amt.value; touch(); renderHero(); save(true); });
        amt.addEventListener('blur', function () {
          if (amt.value.trim() !== '') {
            b.amount = num(amt.value).toFixed(2).replace('.', ',');
            amt.value = b.amount;
            save(true);
          }
        });

        row.appendChild(n);
        row.appendChild(desc);
        row.appendChild(amt);
        panel.appendChild(row);
      });
      sec.appendChild(panel);
      return sec;
    }

    var any = false;
    state[L.key].forEach(function (b, i) {
      if (b.desc.trim() === '' && num(b.amount) === 0) return;
      any = true;
      var label = b.desc.trim() || 'Regel ' + (i + 1);
      var row = document.createElement('button');
      row.type = 'button';
      row.className = 'bill' + (b.skip ? ' parked' : (b.paid ? ' done' : ''));

      var mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = b.skip ? '–' : '✓';

      var name = document.createElement('span');
      name.className = 'bill-name';
      name.textContent = label;

      var amt = document.createElement('span');
      amt.className = 'bill-amt';
      amt.textContent = eur.format(num(b.amount));

      var statusText = b.skip
        ? 'niet aan de beurt deze maand'
        : (b.paid ? 'afgeschreven' : 'nog af te schrijven');
      row.setAttribute('aria-label', label + ' — ' + statusText);

      row.appendChild(mark);
      row.appendChild(name);
      if (L.tri && b.skip) {
        var tag = document.createElement('span');
        tag.className = 'bill-tag';
        tag.textContent = 'niet deze maand';
        row.appendChild(tag);
      }
      row.appendChild(amt);

      row.addEventListener('click', function () {
        if (L.tri) {
          /* aan de beurt -> afgeschreven -> niet aan de beurt -> aan de beurt */
          if (b.skip) { b.skip = false; b.paid = false; }
          else if (!b.paid) { b.paid = true; }
          else { b.paid = false; b.skip = true; }
        } else {
          b.paid = !b.paid;
        }
        touch();
        renderHero();
        renderLists();
        save(true);
      });
      panel.appendChild(row);
    });

    if (!any) {
      var e = document.createElement('p');
      e.className = 'empty';
      e.textContent = L.empty;
      panel.appendChild(e);
    }

    sec.appendChild(panel);
    return sec;
  }

  function renderLists() {
    var c = $('lists');
    c.textContent = '';
    LISTS.forEach(function (L) { c.appendChild(renderList(L)); });
  }

  function renderFooter() {
    var f = $('footer');
    f.textContent = '';

    if (!confirming) {
      var b = document.createElement('button');
      b.className = 'btn solid';
      b.style.width = '100%';
      b.style.padding = '13px';
      b.style.fontSize = '15px';
      b.textContent = 'Nieuwe maand starten';
      b.addEventListener('click', function () { confirming = true; renderFooter(); });
      f.appendChild(b);

      if (state.lastReset) {
        var p = document.createElement('p');
        p.className = 'saved';
        p.style.marginTop = '10px';
        p.textContent = 'Laatste keer gestart op ' + new Date(state.lastReset).toLocaleDateString('nl-NL');
        f.appendChild(p);
      }
      return;
    }

    var box = document.createElement('div');
    box.className = 'reset-confirm';
    var p2 = document.createElement('p');
    p2.textContent = 'De maandelijkse lasten gaan terug naar nog af te schrijven. De periodieke lasten gaan naar niet aan de beurt — tik de nota’s aan die deze maand wel komen. Omschrijvingen, bedragen en saldi blijven staan.';
    var acts = document.createElement('div');
    acts.className = 'reset-actions';

    var yes = document.createElement('button');
    yes.className = 'btn solid';
    yes.textContent = 'Vinkjes wissen';
    yes.addEventListener('click', function () {
      LISTS.forEach(function (L) {
        state[L.key].forEach(function (b) {
          b.paid = false;
          /* Periodieke nota's beginnen de maand geparkeerd: je tikt aan wat wel komt. */
          if (L.tri) b.skip = (b.desc.trim() !== '' || num(b.amount) !== 0);
        });
      });
      state.lastReset = new Date().toISOString();
      touch();
      confirming = false;
      renderAll();
      save();
      flash('Nieuwe maand gestart');
    });

    var no = document.createElement('button');
    no.className = 'btn ghost';
    no.textContent = 'Annuleren';
    no.addEventListener('click', function () { confirming = false; renderFooter(); });

    acts.appendChild(yes);
    acts.appendChild(no);
    box.appendChild(p2);
    box.appendChild(acts);
    f.appendChild(box);
  }

  function renderBackup() {
    var c = $('backup');
    c.textContent = '';

    var head = document.createElement('div');
    head.className = 'section-head';
    var h = document.createElement('h2');
    h.className = 'section-title';
    h.textContent = 'Back-up';
    head.appendChild(h);
    c.appendChild(head);

    var note = document.createElement('p');
    note.className = 'section-note';
    note.textContent = 'Bewaar je gegevens als tekst in je Notities-app. Daarmee zet je alles terug op een nieuwe telefoon of na het opschonen van je browser.';
    c.appendChild(note);

    var panel = document.createElement('div');
    panel.className = 'panel';
    panel.style.padding = '12px';

    if (backupMode === 'export') {
      var hint = document.createElement('p');
      hint.className = 'bk-hint';
      hint.textContent = 'Selecteer de hele tekst en kopieer hem naar je Notities-app. Deel deze tekst met niemand: je bedragen staan erin.';
      var ta = document.createElement('textarea');
      ta.className = 'bk-text';
      ta.rows = 5;
      ta.readOnly = true;
      ta.value = JSON.stringify(state);
      ta.setAttribute('aria-label', 'Back-uptekst');
      panel.appendChild(hint);
      panel.appendChild(ta);

      var eActs = document.createElement('div');
      eActs.className = 'reset-actions';
      var copy = document.createElement('button');
      copy.className = 'btn solid';
      copy.textContent = 'Kopieer tekst';
      copy.addEventListener('click', function () {
        ta.focus();
        ta.setSelectionRange(0, ta.value.length);
        var done = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(ta.value);
            done = true;
          } else {
            done = document.execCommand('copy');
          }
        } catch (e) { done = false; }
        flash(done ? 'Gekopieerd' : 'Kopieer de tekst handmatig');
      });
      var eClose = document.createElement('button');
      eClose.className = 'btn ghost';
      eClose.textContent = 'Sluiten';
      eClose.addEventListener('click', function () { backupMode = null; renderBackup(); });
      eActs.appendChild(copy);
      eActs.appendChild(eClose);
      panel.appendChild(eActs);

    } else if (backupMode === 'import') {
      var iHint = document.createElement('p');
      iHint.className = 'bk-hint';
      iHint.textContent = 'Plak hier je bewaarde back-uptekst. Wat er nu in de app staat, wordt daarmee overschreven.';
      var ita = document.createElement('textarea');
      ita.className = 'bk-text';
      ita.rows = 5;
      ita.placeholder = 'Plak hier je back-up';
      ita.setAttribute('aria-label', 'Back-up terugzetten');
      var err = document.createElement('p');
      err.className = 'bk-hint warn';
      err.style.display = 'none';

      var iActs = document.createElement('div');
      iActs.className = 'reset-actions';
      var put = document.createElement('button');
      put.className = 'btn solid';
      put.textContent = 'Terugzetten';
      put.addEventListener('click', function () {
        var txt = ita.value.trim();
        if (!txt) { err.textContent = 'Er is nog niets geplakt.'; err.style.display = 'block'; return; }
        var d;
        try { d = JSON.parse(txt); } catch (e) { d = null; }
        if (!d || (!Array.isArray(d.accounts) && !Array.isArray(d.bills) && !Array.isArray(d.periodic))) {
          err.textContent = 'Deze tekst is geen geldige back-up. Plak de hele tekst, inclusief de accolades aan begin en eind.';
          err.style.display = 'block';
          return;
        }
        state.accounts = blankAccounts();
        LISTS.forEach(function (L) { state[L.key] = blankList(L.count); });
        apply(txt);
        backupMode = null;
        editing = { bills: false, periodic: false };
        renderAll();
        save();
        flash('Back-up teruggezet');
      });
      var iClose = document.createElement('button');
      iClose.className = 'btn ghost';
      iClose.textContent = 'Annuleren';
      iClose.addEventListener('click', function () { backupMode = null; renderBackup(); });
      iActs.appendChild(put);
      iActs.appendChild(iClose);

      panel.appendChild(iHint);
      panel.appendChild(ita);
      panel.appendChild(err);
      panel.appendChild(iActs);

    } else {
      var acts2 = document.createElement('div');
      acts2.className = 'reset-actions';
      var out = document.createElement('button');
      out.className = 'btn';
      out.textContent = 'Back-up maken';
      out.addEventListener('click', function () { backupMode = 'export'; renderBackup(); });
      var inn = document.createElement('button');
      inn.className = 'btn ghost';
      inn.textContent = 'Back-up terugzetten';
      inn.addEventListener('click', function () { backupMode = 'import'; renderBackup(); });
      acts2.appendChild(out);
      acts2.appendChild(inn);
      panel.appendChild(acts2);
    }

    c.appendChild(panel);
  }

  function renderAll() {
    renderHero();
    renderAccounts();
    renderLists();
    renderFooter();
    renderBackup();
  }

  load().then(renderAll)['catch'](renderAll);
})();
</script>
</body>
</html>
